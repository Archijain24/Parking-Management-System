# Simple SonarQube configuration for auth-service.
# Run with (SonarQube server must be running locally, e.g. via sonar-scanner or
# mvn sonar:sonar):
#   mvn clean verify sonar:sonar -Dsonar.projectKey=parkezz-auth-service -Dsonar.host.url=http://localhost:9000 -Dsonar.login=<your-token>
sonar.projectKey=parkezz-auth-service
sonar.projectName=Parkezz - auth-service
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
sonar.sourceEncoding=UTF-8
